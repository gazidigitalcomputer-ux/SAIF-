<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saif AI Assistant</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f8fafc;
        }
        /* Botpress iframe/widget-কে পুরো স্ক্রিনে ছড়িয়ে দেওয়ার জন্য CSS */
        iframe {
            width: 100% !important;
            height: 100% !important;
            border: none !important;
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
        }
        .bpw-layout {
            width: 100% !important;
            height: 100% !important;
            max-height: 100% !important;
        }
    </style>
</head>
<body>

    <!-- Botpress Saif AI Chatbot Script -->
    <script src="https://cdn.botpress.cloud/webchat/v5.0/inject.js"></script>
    <script src="https://files.bpcontent.cloud/2026/08/27/17/20260827174335-S6IWMWHX.js" defer></script>

    <script>
        // পেজ লোড হওয়ার সাথে সাথে বটের চ্যাট উইন্ডো অটোমেটিক ওপেন হবে
        window.addEventListener('load', function() {
            var interval = setInterval(function() {
                if (window.botpressWebChat) {
                    window.botpressWebChat.sendEvent({ type: 'show' });
                    clearInterval(interval);
                }
            }, 500);
        });
    </script>

</body>
</html>
